<!doctype html>
<html lang="pt-BR" class="tema-escuro dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor SMG Agendamentos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // aplica o tema salvo antes do React (evita lampejo de cor errada)
      try {
        var t = localStorage.getItem('app_tema') || 'escuro'
        if (/^\/(s|pagamento)\//.test(location.pathname)) t = 'claro'
        document.documentElement.className = 'tema-' + t + (t === 'claro' ? '' : ' dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
